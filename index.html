<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minesweeper</title>
<style>
  body {
    background: #111;
    color: #ccc;
    font-family: Arial, sans-serif;
    font-size: 13px;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  /* Difficulty row */
  .diff-row {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
  }
  .diff-btn {
    background: #222;
    color: #aaa;
    border: 1px solid #444;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  .diff-btn:hover { background: #2a2a2a; }
  .diff-btn.active { background: #333; color: #eee; border-color: #666; }

  /* Header: mine counter | reset | timer */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 5px 10px;
    margin-bottom: 6px;
  }
  .lcd {
    font-family: monospace;
    font-size: 18px;
    font-weight: bold;
    color: #0f0;
    background: #000;
    border: 1px solid #222;
    padding: 2px 7px;
    min-width: 3ch;
    text-align: right;
  }
  .reset-btn {
    background: #2a2a2a;
    border: 2px outset #555;
    padding: 2px 8px;
    font-size: 18px;
    cursor: pointer;
    line-height: 1.3;
  }
  .reset-btn:active { border-style: inset; }

  /* Board */
  .board {
    display: inline-grid;
    gap: 1px;
    background: #1a1a1a;
    border: 2px solid #333;
    padding: 2px;
  }
  .cell {
    width: 24px;
    height: 24px;
    background: #3c3c3c;
    border: 2px outset #5a5a5a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .cell:hover { background: #454545; }
  .cell.revealed {
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    cursor: default;
  }
  .cell.revealed:hover { background: #1e1e1e; }

  /* Number colors */
  .cell[data-n="1"] { color: #6af; }
  .cell[data-n="2"] { color: #6c6; }
  .cell[data-n="3"] { color: #f55; }
  .cell[data-n="4"] { color: #88f; }
  .cell[data-n="5"] { color: #f84; }
  .cell[data-n="6"] { color: #4cc; }
  .cell[data-n="7"] { color: #ddd; }
  .cell[data-n="8"] { color: #666; }

  .cell.mine-revealed { background: #200; border-color: #500; }
  .cell.mine-fatal    { background: #600; border-color: #900; }
  .cell.wrong-flag    { background: #200; color: #f44; border-color: #500; }

  /* Status line */
  .status {
    margin-top: 6px;
    font-size: 11px;
    color: #444;
    text-align: center;
  }
  .status.win  { color: #585; }
  .status.lose { color: #844; }
</style>
</head>
<body>

<div class="diff-row">
  <button class="diff-btn" data-d="beginner">Beginner</button>
  <button class="diff-btn" data-d="intermediate">Intermediate</button>
  <button class="diff-btn active" data-d="expert">Expert</button>
</div>

<div class="header">
  <span class="lcd" id="counter">099</span>
  <button class="reset-btn" id="resetBtn">🙂</button>
  <span class="lcd" id="timer">000</span>
</div>

<div class="board" id="board"></div>

<div class="status" id="status">left-click reveal &nbsp;·&nbsp; right-click flag/mark</div>

<script>
const DIFFICULTIES = {
  beginner:     { rows: 9,  cols: 9,  mines: 10 },
  intermediate: { rows: 16, cols: 16, mines: 40 },
  expert:       { rows: 16, cols: 30, mines: 99 },
};

let state = {};

function initGame(d) {
  const cfg = DIFFICULTIES[d];
  clearInterval(state.timerInterval);
  state = {
    difficulty: d, rows: cfg.rows, cols: cfg.cols, totalMines: cfg.mines,
    cells: [], gameStatus: 'idle', firstClick: true,
    flagCount: 0, timerValue: 0, timerInterval: null,
  };
  for (let r = 0; r < state.rows; r++) {
    state.cells[r] = [];
    for (let c = 0; c < state.cols; c++)
      state.cells[r][c] = { isMine: false, isRevealed: false, cellState: 'normal', neighborCount: 0 };
  }
  renderBoard();
  document.getElementById('resetBtn').textContent = '🙂';
  document.getElementById('timer').textContent = '000';
  setStatus('', 'left-click reveal · right-click flag/mark');
  updateCounter();
}

function placeMines(er, ec) {
  const forbidden = new Set();
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      const nr = er + dr, nc = ec + dc;
      if (nr >= 0 && nr < state.rows && nc >= 0 && nc < state.cols)
        forbidden.add(nr * state.cols + nc);
    }
  let placed = 0;
  const total = state.rows * state.cols;
  while (placed < state.totalMines) {
    const idx = Math.floor(Math.random() * total);
    if (!forbidden.has(idx)) {
      const r = Math.floor(idx / state.cols), c = idx % state.cols;
      if (!state.cells[r][c].isMine) { state.cells[r][c].isMine = true; placed++; }
    }
  }
  calcNeighbors();
}

function calcNeighbors() {
  for (let r = 0; r < state.rows; r++)
    for (let c = 0; c < state.cols; c++) {
      if (state.cells[r][c].isMine) continue;
      let n = 0;
      eachNeighbor(r, c, (nr, nc) => { if (state.cells[nr][nc].isMine) n++; });
      state.cells[r][c].neighborCount = n;
    }
}

function eachNeighbor(r, c, fn) {
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < state.rows && nc >= 0 && nc < state.cols) fn(nr, nc);
    }
}

function renderBoard() {
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${state.cols}, 24px)`;
  board.innerHTML = '';
  for (let r = 0; r < state.rows; r++)
    for (let c = 0; c < state.cols; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.dataset.r = r; el.dataset.c = c;
      el.addEventListener('click', onLeft);
      el.addEventListener('contextmenu', onRight);
      el.addEventListener('mousedown', e => {
        if (e.button === 0 && state.gameStatus !== 'won' && state.gameStatus !== 'lost')
          document.getElementById('resetBtn').textContent = '😮';
      });
      board.appendChild(el);
    }
}

document.addEventListener('mouseup', () => {
  if (state.gameStatus !== 'won' && state.gameStatus !== 'lost')
    document.getElementById('resetBtn').textContent = '🙂';
});

function cellEl(r, c) { return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`); }

function refreshCell(r, c) {
  const cell = state.cells[r][c], el = cellEl(r, c);
  if (!el) return;
  el.removeAttribute('data-n'); el.className = 'cell'; el.textContent = '';
  if (!cell.isRevealed) {
    if (cell.cellState === 'flagged')  el.textContent = '🚩';
    if (cell.cellState === 'question') el.textContent = '❓';
    return;
  }
  if (cell.isMine) { el.classList.add('mine-revealed'); el.textContent = '💣'; }
  else {
    el.classList.add('revealed');
    if (cell.neighborCount > 0) { el.dataset.n = cell.neighborCount; el.textContent = cell.neighborCount; }
  }
}

function onLeft(e) {
  if (state.gameStatus === 'won' || state.gameStatus === 'lost') return;
  const r = +e.currentTarget.dataset.r, c = +e.currentTarget.dataset.c;
  const cell = state.cells[r][c];
  if (cell.isRevealed) { if (cell.neighborCount > 0) chordReveal(r, c); return; }
  if (cell.cellState !== 'normal') return;
  if (state.firstClick) {
    state.firstClick = false; placeMines(r, c); startTimer(); state.gameStatus = 'playing';
  }
  revealCell(r, c); checkWin();
}

function onRight(e) {
  e.preventDefault();
  if (state.gameStatus === 'won' || state.gameStatus === 'lost') return;
  const r = +e.currentTarget.dataset.r, c = +e.currentTarget.dataset.c;
  const cell = state.cells[r][c];
  if (cell.isRevealed) return;
  if (cell.cellState === 'normal')       { cell.cellState = 'flagged';  state.flagCount++; }
  else if (cell.cellState === 'flagged') { cell.cellState = 'question'; state.flagCount--; }
  else                                    { cell.cellState = 'normal'; }
  updateCounter(); refreshCell(r, c);
}

function revealCell(r, c) {
  const cell = state.cells[r][c];
  if (cell.isRevealed || cell.cellState === 'flagged') return;
  cell.isRevealed = true; cell.cellState = 'normal';
  if (cell.isMine) { endGame(false, r, c); return; }
  refreshCell(r, c);
  if (cell.neighborCount === 0)
    eachNeighbor(r, c, (nr, nc) => {
      if (!state.cells[nr][nc].isRevealed && state.cells[nr][nc].cellState !== 'flagged') revealCell(nr, nc);
    });
}

function chordReveal(r, c) {
  let flagged = 0;
  eachNeighbor(r, c, (nr, nc) => { if (state.cells[nr][nc].cellState === 'flagged') flagged++; });
  if (flagged !== state.cells[r][c].neighborCount) return;
  eachNeighbor(r, c, (nr, nc) => {
    if (!state.cells[nr][nc].isRevealed && state.cells[nr][nc].cellState !== 'flagged') revealCell(nr, nc);
  });
  checkWin();
}

function checkWin() {
  if (state.gameStatus !== 'playing') return;
  for (let r = 0; r < state.rows; r++)
    for (let c = 0; c < state.cols; c++)
      if (!state.cells[r][c].isMine && !state.cells[r][c].isRevealed) return;
  endGame(true, -1, -1);
}

function endGame(won, fr, fc) {
  stopTimer(); state.gameStatus = won ? 'won' : 'lost';
  if (won) {
    document.getElementById('resetBtn').textContent = '😎';
    setStatus('win', 'you win!');
    for (let r = 0; r < state.rows; r++)
      for (let c = 0; c < state.cols; c++)
        if (state.cells[r][c].isMine && state.cells[r][c].cellState !== 'flagged') {
          state.cells[r][c].cellState = 'flagged'; refreshCell(r, c);
        }
    state.flagCount = state.totalMines; updateCounter();
  } else {
    document.getElementById('resetBtn').textContent = '😵';
    setStatus('lose', 'boom.');
    for (let r = 0; r < state.rows; r++)
      for (let c = 0; c < state.cols; c++) {
        const cell = state.cells[r][c];
        if (r === fr && c === fc) {
          cell.isRevealed = true;
          const el = cellEl(r, c); el.className = 'cell mine-fatal'; el.textContent = '💣';
        } else if (cell.isMine && !cell.isRevealed && cell.cellState !== 'flagged') {
          cell.isRevealed = true; refreshCell(r, c);
        } else if (!cell.isMine && cell.cellState === 'flagged') {
          const el = cellEl(r, c); el.className = 'cell wrong-flag'; el.textContent = '❌';
        }
      }
  }
}

function startTimer() {
  state.timerValue = 0;
  state.timerInterval = setInterval(() => {
    state.timerValue = Math.min(state.timerValue + 1, 999);
    document.getElementById('timer').textContent = fmt3(state.timerValue);
  }, 1000);
}
function stopTimer() { clearInterval(state.timerInterval); state.timerInterval = null; }

function updateCounter() {
  const n = state.totalMines - state.flagCount;
  document.getElementById('counter').textContent = fmt3(Math.max(-99, Math.min(999, n)));
}
function fmt3(n) {
  if (n < 0) return '-' + String(Math.abs(n)).padStart(2, '0');
  return String(n).padStart(3, '0');
}
function setStatus(cls, msg) {
  const el = document.getElementById('status');
  el.className = 'status' + (cls ? ' ' + cls : '');
  el.textContent = msg;
}

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    initGame(btn.dataset.d);
  });
});
document.getElementById('resetBtn').addEventListener('click', () => {
  initGame(document.querySelector('.diff-btn.active')?.dataset.d || 'expert');
});

initGame('expert');
</script>
</body>
</html>
